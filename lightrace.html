<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LIGHT RACE — гонка к финишу</title>
<style>
html,body{margin:0;height:100%;background:#02040d;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#cv{display:block;width:100vw;height:100vh}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;color:#8fe8ff;font-weight:700;letter-spacing:1px;text-shadow:0 0 8px rgba(0,200,255,.55);pointer-events:none;z-index:5;font-size:14px}
.hud b{color:#e8fbff}
#energyWrap{margin-top:5px;width:100px;height:7px;border:1px solid rgba(53,240,255,.7);border-radius:4px;overflow:hidden;background:rgba(0,30,50,.4)}
#energy{height:100%;width:0%;background:linear-gradient(90deg,#a0f,#3ff);transition:width .1s linear}
#boostBtn{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;border:2px solid #35f0ff;background:rgba(0,40,70,.45);color:#eaffff;font-weight:800;font-size:14px;letter-spacing:1px;z-index:6;box-shadow:0 0 18px rgba(53,240,255,.45);overflow:hidden}
#bfill{position:absolute;left:0;bottom:0;width:100%;height:0%;background:linear-gradient(90deg,#0af,#3ff);opacity:.6;pointer-events:none;transition:height .12s linear}
#btxt{position:relative;z-index:1}
#boostBtn:active{filter:brightness(1.35)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(1,3,10,.88);padding:12px;box-sizing:border-box}
#panel{max-width:560px;width:94%;padding:22px 20px;border:1px solid rgba(53,240,255,.6);border-radius:14px;background:rgba(2,10,26,.94);box-shadow:0 0 40px rgba(0,140,255,.25);color:#cfeeff;text-align:center;max-height:88vh;max-height:88dvh;overflow:auto;box-sizing:border-box}
#panel h1{margin:0 0 6px;font-size:30px;letter-spacing:4px;color:#35f0ff;text-shadow:0 0 18px rgba(53,240,255,.8)}
#panel h1 span{color:#ff7a2f;text-shadow:0 0 18px rgba(255,122,47,.8)}
#panel p{margin:8px 0;font-size:14px;line-height:1.45;color:#9fd8ee}
#panel button{padding:10px 22px;font-size:14px;font-weight:800;letter-spacing:1px;color:#03121c;background:linear-gradient(180deg,#6ff,#18c8e8);border:none;border-radius:8px;cursor:pointer;box-shadow:0 0 16px rgba(53,240,255,.5);margin:4px}
#panel button:disabled{opacity:.4;cursor:default}
#panel button.alt{background:linear-gradient(180deg,#ffd27f,#ff9a3c)}
#panel button.dim{background:rgba(120,160,200,.25);color:#9fd8ee;box-shadow:none}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
#cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.card{width:168px;background:rgba(6,20,40,.85);border:1px solid rgba(53,240,255,.45);border-radius:10px;padding:8px 6px;text-align:center;box-sizing:border-box}
.card.sel{border-color:#7dffc0;box-shadow:0 0 16px rgba(125,255,192,.4)}
.card.lock{opacity:.5}
.card h3{margin:2px 0;font-size:14px;color:#e8fbff;letter-spacing:1px}
.card .st{font-size:10px;color:#ffd27f;margin:2px 0;line-height:1.35}
.card p{margin:3px 0;font-size:10px;color:#9fd8ee;line-height:1.3}
.card canvas{width:140px;height:100px;display:block;margin:2px auto}
.card button{margin:5px 0 0;padding:6px 12px;font-size:11px;font-weight:800;color:#03121c;background:linear-gradient(180deg,#6ff,#18c8e8);border:none;border-radius:6px;cursor:pointer}
.card button.buy{background:linear-gradient(180deg,#c89cff,#7a3cff);color:#fff}
.grow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(6,20,40,.6);border:1px solid rgba(53,240,255,.3);border-radius:8px;padding:7px 10px;margin:6px 0;text-align:left}
.grow .t{flex:1}
.grow .t b{color:#e8fbff;font-size:13px}
.grow .t span{color:#7fc6de;font-size:11px}
.grow button{padding:6px 12px;font-size:11px;margin:0}
@media (max-width:480px){
  .hud{font-size:11px;padding:6px 8px}
  #energyWrap{width:78px;height:6px;margin-top:3px}
  #boostBtn{width:74px;height:74px;font-size:12px;right:10px}
  #panel{padding:14px 10px;max-width:96%}
  #panel h1{font-size:24px;letter-spacing:2px}
  #panel p{font-size:12px}
  .card{width:calc(50% - 6px)}
}
</style>
</head>

<canvas id="cv"></canvas>
<div class="hud">
  <div>КРИСТАЛЛЫ <b id="hCry">0</b><br><span style="font-size:11px">БАНК <span id="hBank">0</span> ◈ · РЕКОРД <span id="hBest">0</span></span></div>

</div>
<button id="boostBtn"><span id="bfill"></span><span id="btxt">ТУРБО</span></button>
<div id="overlay"><div id="panel"></div></div>
<script>
(function(){
'use strict';
// Все ссылки на интерфейс — сразу
var hCry=document.getElementById('hCry'), hBank=document.getElementById('hBank'),
    hBest=document.getElementById('hBest'), hDist=document.getElementById('hDist'),
    hPlace=document.getElementById('hPlace'), hKills=document.getElementById('hKills'),
    hResc=document.getElementById('hResc'), hE=document.getElementById('hE'),
    energyEl=document.getElementById('energy'), bfill=document.getElementById('bfill'),
    overlay=document.getElementById('overlay'), panel=document.getElementById('panel'),
    bb=document.getElementById('boostBtn');
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.width=Math.round(innerWidth*DPR);H=cv.height=Math.round(innerHeight*DPR);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);resize();

var AH=150, GRID=20, TRACK_LEN=6000, MAX_TRAIL=60, TRAIL_LIFE=3.5, PI=Math.PI, TAU=PI*2;
var N_ENEMIES=5;
// ===== 10 аппаратов: профиль корпуса, кабина, фишка (fl), удача (lk) и личные ветки прокачки (uk) =====
// lk: +2 — везучий (красный сюрприз почти не страшен), -2 — злой рок (красный чаще)
var STYLES={
  you:    {mn:'АВАНГАРД',prof:[[0,3.1],[0.8,1.9],[1.05,0.2],[0.9,-1.9],[0,-2.7]],can:'bubble',pods:true, fin:false,wings:false,
    lk:0, fl:'Ровный универсал: без бонусов и без проколов',
    uk:['fuel','tank','magnet','boost','spd','steer','neon','hybrid']},
  cobra:  {mn:'ЗМЕЙ',    prof:[[0,3.4],[0.5,2.0],[0.75,0.2],[0.55,-1.8],[0,-2.6]],can:'slit',  pods:false,fin:true, wings:false,
    lk:-1, fl:'Быстрый клин: манит красный сюрприз',
    uk:['fuel','tank','boost','spd','steer','neon','hybrid']},
  strizh: {mn:'СТРИЖ-М', prof:[[0,3.3],[0.6,2.2],[0.85,0.1],[0.8,-2.2],[0,-2.9]], can:'bubble',pods:true, fin:false,wings:true,
    lk:1, fl:'Везучий: чаще ловит хорошие призы',
    uk:['fuel','tank','magnet','boost','spd','steer','neon','dash']},
  phantom:{mn:'ФАНТОМ-Х',prof:[[0,2.8],[1.1,1.6],[1.3,-0.4],[1.0,-2.0],[0,-2.5]],can:'twin',  pods:false,fin:false,wings:false,
    lk:0, fl:'Огромный бак и десять путей прокачки',
    uk:['fuel','tank','magnet','boost','spd','steer','neon','lucky','hybrid','econ']},
  zenit:  {mn:'ЗЕНИТ-Р', prof:[[0,3.2],[0.9,1.7],[0.7,-0.6],[0.95,-2.0],[0,-2.6]],can:'bubble',pods:false,fin:true, wings:true,
    lk:0, fl:'Стреловидный гонец с длинным рывком',
    uk:['fuel','tank','magnet','boost','spd','steer','dash','econ']},
  nox:    {mn:'НОКС-К',  prof:[[0,2.9],[0.5,1.4],[1.15,0.3],[1.2,-1.4],[0.5,-2.4],[0,-2.5]],can:'slit',pods:true,fin:false,wings:false,
    lk:2, fl:'Талисман удачи: красный почти не страшен, но сток скромный',
    uk:['fuel','magnet','boost','steer','hybrid']},
  pulsar: {mn:'ПУЛЬСАР', prof:[[0,2.9],[0.95,1.8],[1.0,-0.2],[0.9,-1.7],[0,-2.4]],can:'twin',  pods:true, fin:false,wings:false,
    lk:-2, fl:'Мощная тяга, но злой рок: красный чаще',
    uk:['fuel','tank','magnet','boost','spd','steer','neon','lucky','hybrid']},
  astra:  {mn:'АСТРА-Л', prof:[[0,3.6],[0.55,2.4],[0.7,0.4],[0.5,-2.1],[0,-2.8]],can:'slit',  pods:false,fin:false,wings:false,
    lk:1, fl:'Скользкий везунчик с самой длинной мордой',
    uk:['fuel','tank','magnet','boost','spd','steer','neon']},
  cyclone:{mn:'ЦИКЛОН',  prof:[[0,3.0],[0.75,1.9],[0.5,0.3],[0.9,-1.3],[0,-2.7]],can:'bubble',pods:false,fin:true, wings:true,
    lk:-1, fl:'Шеврон с десятью ветками и капризной судьбой',
    uk:['fuel','tank','magnet','boost','spd','steer','neon','dash','econ','hybrid']},
  storm:  {mn:'ШТОРМ-9', prof:[[0,2.9],[1.0,1.9],[1.25,0.0],[1.1,-1.9],[0,-2.6]],can:'twin',  pods:true, fin:false,wings:true,
    lk:0, fl:'ЭПИК: самая быстрая машина, все 11 веток прокачки',
    uk:['fuel','tank','magnet','boost','spd','steer','neon','lucky','hybrid','dash','econ']}
};
// ===== Лестница характеристик: ступень каждого следующего аппарата чуть выше
// полной прокачки предыдущего. ШТОРМ в максимуме — эпический байк игры =====
var TIER_S =[42,  44.5,47,  49.5,52,  54.5,57,  59.5,62,  65];
var TIER_TK=[100, 115, 130, 145, 160, 175, 190, 205, 220, 240];
var TIER_BM=[1.80,1.85,1.90,1.95,2.00,2.05,2.10,2.15,2.20,2.25];
function bikeTierId(n){
  if(n==='you') return 0;
  for(var i=0;i<RIDERS.length;i++) if(RIDERS[i].n===n) return i+1;
  return 0;
}
function stockStats(tier){ return {s:TIER_S[tier],tk:TIER_TK[tier],tr:2.2,bm:TIER_BM[tier]}; }
// ===== 9 соперников: имя, аппарат, цена байка в банке, характер и стиль пилота =====
// style: racer — вперёд на всех парах, hunter — любит кристаллы,
// hoarder — копит бак до отказа и несётся на турбо, econ — бережёт топливо под финиш
var RIDERS=[
  {n:'КОБРА',  sty:'cobra',  col:'255,64,90',   d:'Клиновидный хищник со шпилем',          price:2500, style:'racer',   skill:1.08,greed:0.75,plan:'spender', aggr:0.60,risk:0.60,err:0.22},
  {n:'СТРИЖ',  sty:'strizh', col:'120,255,90',  d:'Длинный и лёгкий, с обтекателем',       price:3200, style:'hoarder', skill:1.00,greed:0.60,plan:'saver',   aggr:0.45,risk:0.45,err:0.20},
  {n:'ФАНТОМ', sty:'phantom',col:'255,80,200',  d:'Широкий стелс с двумя кабинами',        price:4000, style:'hunter',  skill:0.92,greed:1.00,plan:'spender', aggr:0.40,risk:0.50,err:0.26},
  {n:'ЗЕНИТ',  sty:'zenit',  col:'255,220,70',  d:'Стреловидный, крылья и шпиль',          price:5000, style:'racer',   skill:1.05,greed:0.65,plan:'finisher',aggr:0.50,risk:0.55,err:0.24},
  {n:'НОКС',   sty:'nox',    col:'170,110,255', d:'Крестообразный корпус, острый козырёк', price:6200, style:'econ',    skill:0.94,greed:0.85,plan:'saver',   aggr:0.35,risk:0.40,err:0.19},
  {n:'ПУЛЬСАР',sty:'pulsar', col:'255,140,60',  d:'Округлый с крупными гондолами',         price:7600, style:'hunter',  skill:0.97,greed:0.70,plan:'spender', aggr:0.55,risk:0.50,err:0.23},
  {n:'АСТРА',  sty:'astra',  col:'220,240,255', d:'Самый длинный и скользкий',             price:9200, style:'racer',   skill:1.10,greed:0.50,plan:'saver',   aggr:0.30,risk:0.40,err:0.16},
  {n:'ЦИКЛОН', sty:'cyclone',col:'90,230,200',  d:'Шевронный корпус с плавниками',         price:11500,style:'hunter',  skill:0.90,greed:0.90,plan:'spender', aggr:0.50,risk:0.70,err:0.27},
  {n:'ШТОРМ',  sty:'storm',  col:'90,150,255',  d:'Тяжёлый клин с мощными гондолами',      price:14000,style:'econ',    skill:0.96,greed:0.60,plan:'finisher',aggr:0.45,risk:0.50,err:0.21}
];
function getRider(n){ for(var i=0;i<RIDERS.length;i++) if(RIDERS[i].n===n) return RIDERS[i]; return null; }
// ===== Улучшения. Каждому аппарату доступна своя часть этого списка =====
var UPGRADES=[
  {k:'fuel',  nm:'Стартовый бак',     pr:[0,300,900,2200],  fx:['пустой','10% бака','50% бака','полный бак'], d:'Сколько топлива в баке на старте'},
  {k:'tank',  nm:'Объём бака',        pr:[0,600,1800,4500], fx:['100','+40','+80','+150'],                    d:'Ёмкость турбо: больше — дольше буст'},
  {k:'magnet',nm:'Магнит-сборщик',    pr:[0,400,1400,3800], fx:['10 м','13 м','15 м','20 м'],                 d:'Радиус подбора кристаллов'},
  {k:'boost', nm:'Тяга турбо',        pr:[0,500,1500,3600], fx:['×1.80','×1.90','×2.00','×2.15'],             d:'Ускорение на бусте'},
  {k:'spd',   nm:'Форсаж корпуса',    pr:[0,700,2000,5000], fx:['+0%','+2%','+4%','+7%'],                      d:'Максимальная скорость'},
  {k:'steer', nm:'Управление',        pr:[0,400,1200],      fx:['+0%','+12%','+22%'],                          d:'Резкость руля'},
  {k:'neon',  nm:'Неон-пакет',        pr:[0,250,700],       fx:['стандарт','ярче','огонь'],                    d:'Свечение трубок на корпусе'},
  {k:'lucky', nm:'Фильтр удачи',      pr:[0,1600],          fx:['—','красный сюрприз даёт топливо'],           d:'Защита от антиприза'},
  {k:'hybrid',nm:'Гибридный кристалл',pr:[0,1800],          fx:['—','+10 за кристалл'],                        d:'Заряд от обычных кристаллов'},
  {k:'dash',  nm:'Удлинённый рывок',    pr:[0,900,2600],        fx:['2.5 с','3.5 с','4.5 с'],  d:'Сюрприз РЫВОК длится дольше'},
  {k:'econ',  nm:'Экономайзер',         pr:[0,800,2200,4200],   fx:['0%','-10%','-20%','-30%'],d:'Турбо тратит меньше топлива'}
];
// Соперникам покупки дешевле — иначе они богатели бы годами
var RIV_PR={spd:[0,250,700,1800],tank:[0,200,600,1500],boost:[0,150,450,1200]};
// ===== Сохранение: банк, тюнинг каждого байка отдельно, кошельки соперников =====
function loadSave(){
  try{
    var s=JSON.parse(localStorage.getItem('lr_save_v3')||'null');
    if(s&&s.tune) return s;
  }catch(e){}
  var s2=null;
  try{ s2=JSON.parse(localStorage.getItem('lr_save_v2')||'null'); }catch(e){}
  if(s2&&s2.upg){
    // Перенос: старый тюнинг достаётся тому байку, на котором ты ездил
    var sel=s2.sel||'you';
    s2.tune={};
    s2.tune[sel]=s2.upg;
    if(!s2.tune.you) s2.tune.you={fuel:0,tank:0,magnet:0,boost:0,spd:0,steer:0,neon:0,lucky:0,hybrid:0};
    delete s2.upg;
    return s2;
  }
  return {bank:0,best:0,unlocked:[],owned:[],sel:'you',
    tune:{you:{fuel:0,tank:0,magnet:0,boost:0,spd:0,steer:0,neon:0,lucky:0,hybrid:0}},
    rivals:{}};
}
function saveGame(){ try{ localStorage.setItem('lr_save_v3',JSON.stringify(SV)); }catch(e){} }
var SV=loadSave();
for(var ri0=0;ri0<RIDERS.length;ri0++){
  var rn=RIDERS[ri0].n;
  if(!SV.rivals[rn]) SV.rivals[rn]={cr:0,spd:0,tank:0,boost:0};
}
// Эффекты тюнинга — пересчитываются на каждый заезд
var TANK_CAP=100, START_EN=0, CRYS_CHG=30, COLLECT_R=10, BOOST_M=1.8, MAX_SPD=42, STEER_R=2.2, LUCKY=false, NEON_K=1;
var DASH_T=2.5, ECON_K=1;
function curTune(){
  var t=SV.tune[SV.sel];
  if(!t){ t={fuel:0,tank:0,magnet:0,boost:0,spd:0,steer:0,neon:0,lucky:0,hybrid:0}; SV.tune[SV.sel]=t; }
  return t;
}
function applyUpgrades(){
  var u=curTune();
  var bs=stockStats(bikeTierId(SV.sel));
  START_EN=Math.round(bs.tk*[0,0.1,0.5,1][u.fuel||0]);
  TANK_CAP=bs.tk+[0,40,80,150][u.tank||0];
  CRYS_CHG=30+(u.hybrid?10:0);
  COLLECT_R=[10,13,15,20][u.magnet||0];
  BOOST_M=bs.bm+[0,0.1,0.2,0.35][u.boost||0];
  MAX_SPD=bs.s*(1+[0,0.02,0.04,0.07][u.spd||0]);
  STEER_R=bs.tr*(1+[0,0.12,0.22][u.steer||0]);
  LUCKY=!!u.lucky;
  NEON_K=1+0.15*(u.neon||0);
  DASH_T=[2.5,3.5,4.5][u.dash||0];
  ECON_K=[1,0.9,0.8,0.7][u.econ||0];
}
function playerStats(){ applyUpgrades(); return {s:MAX_SPD,tk:TANK_CAP,tr:STEER_R,bm:BOOST_M}; }
// Равные шансы: соперники стартуют на уровне стока твоего аппарата,
// а их покупки из кошельков подтягивают до твоего максимума
function rivalStats(r){
  var rv=SV.rivals[r.n]||{cr:0,spd:0,tank:0,boost:0};
  var bs=stockStats(bikeTierId(SV.sel));
  var m=[0,0.02,0.04,0.07][rv.spd||0];
  return {s:bs.s*(1+m),tk:bs.tk+[0,40,80,150][rv.tank||0],tr:bs.tr*(1+m),bm:bs.bm+[0,0.1,0.2,0.3][rv.boost||0]};
}
var state='menu';
var P=null, enemies=[], bikes=[], particles=[], crystals=[], finishOrder=[];
var usedRiders=[];
var spectate=false, spectMsgT=0;
var msgT=0, msgText='', msgCol='53,240,255';
var score=0, kills=0, crysN=0, respT=8;
var best=SV.best||0;
var newUnlock=null, garTab='up';
var shake=0, tG=0, graceT=0;
var countT=0, countPrev=-99;
var steerKey=0, touchSteer=0, touchOn=false, touchX0=0;
var boostKey=false, boostBtnOn=false;
var energy=0, boosting=false;
var cam={x:0,y:7,z:-16,yaw:0,pitch:0.15,kick:0,phase:'chase',timer:14,phaseT:0};

function clamp(v,a,b){if(v<a)return a;if(v>b)return b;return v;}
function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function riderParts(rn){
  var rv=SV.rivals[rn]||{cr:0,spd:0,boost:0};
  return {spoiler:(rv.spd||0)>0,front:false,side:(rv.boost||0)>0,neon:false};
}
function makeBike(x,z,ang,isP,rider,st,parts){

function updateEnemy(e,dt){

      e.invT=1.2;
    }

  }
  if(e.invT>0) e.invT-=dt;
  if(e.freeT>0) e.freeT-=dt;
  if(e.slowT>0) e.slowT-=dt;
  if(e.boostReactT>0) e.boostReactT-=dt;
  collect(e);
  if(e.blockT>0){
    e.blockT-=dt;
    e.ang=clamp(e.ang+e.blockDir*1.6*dt,-1.05,1.05);
    moveBike(e,dt);
    if(e.invT<=0&&hitWall(e,true)) crash(e);
    return;
  }
  e.thinkT-=dt;
  if(e.thinkT<=0) think(e);
  e.errT-=dt;
  var ta;
  var ax=e.x+Math.sin(e.ang)*36, az=e.z+Math.cos(e.ang)*36;
  if(dangerAt(ax,az)){

    var r=dangerAt(e.x+Math.sin(e.ang+1.0)*30, e.z+Math.cos(e.ang+1.0)*30);
    if(l&&!r) ta=e.ang+0.85;

    if(b.z>bz){ bz=b.z; bestB=b; }
  }
  return bestB;
}
function update(dt){
  if(P.alive&&!P.done){
    if(P.stunT>0){
      P.stunT-=dt;
      P.ang+=9*dt;
      if(P.stunT<=0){
        P.x=clamp(P.x,-AH+12,AH-12);
        P.trail=[{x:P.x,z:P.z,t:tG}]; P.tlen=0;
        P.invT=1.2;
        msgText='ПОЕХАЛИ ДАЛЬШЕ!'; msgCol='80,255,120'; msgT=1.2;
      }
    } else {
      if(graceT>0){ graceT-=dt; if(graceT<=0){ P.trail=[{x:P.x,z:P.z,t:tG}]; P.tlen=0; } }
      if(P.invT>0) P.invT-=dt;
      if(P.freeT>0) P.freeT-=dt;
      if(P.slowT>0) P.slowT-=dt;
      var steer=clamp(steerKey+touchSteer,-1,1);
      P.ang=clamp(P.ang+steer*P.trn*dt,-0.95,0.95);
      var wantBoost=(boostKey||boostBtnOn)&&energy>0.5;
      if(wantBoost&&!boosting) sfxBoost();
      boosting=wantBoost;
      if(boosting) energy=Math.max(0,energy-26*ECON_K*dt);
      P.boost=boosting||P.freeT>0;
      moveBike(P,dt); collect(P);
      score+=P.baseSpd*(P.boost?P.bmul:1)*(P.slowT>0?0.6:1)*dt*0.1;
      if(graceT<=0&&P.invT<=0&&hitWall(P)) crash(P);
      if(P.z>=TRACK_LEN&&!P.done){ P.done=true; finishOrder.push(P); P.place=finishOrder.length; winGame(); }
    }
  }
  for(var i=0;i<enemies.length;i++) updateEnemy(enemies[i],dt);
  if(!spectate){
    var alive=0;
    for(var j=0;j<enemies.length;j++) if(enemies[j].alive&&!enemies[j].done) alive++;
    if(alive<N_ENEMIES){
      respT-=dt;
      if(respT<=0){
        var cand=RIDERS.filter(function(r){ return r.n!==SV.sel && usedRiders.indexOf(r.n)<0; });
        if(!cand.length) cand=RIDERS.filter(function(r){ return r.n!==SV.sel; });
        var r2=cand[(Math.random()*cand.length)|0];
        usedRiders.push(r2.n);
        var ne=makeBike((Math.random()*2-1)*(AH-60),Math.min(P.z+320,TRACK_LEN-500),0,false,r2,rivalStats(r2),riderParts(r2.n));
        ne.lane=ne.x*0.8;
        ne.skill=r2.skill; ne.greed=r2.greed; ne.plan=r2.plan; ne.style=r2.style;
        ne.aggr=r2.aggr; ne.risk=r2.risk; ne.err=r2.err;
        enemies.push(ne); bikes.push(ne);
        respT=7+Math.random()*4;
        msgText='В ГОНКУ ВЕРНУЛСЯ '+r2.n; msgCol='255,220,70'; msgT=1.4;
      }
    }
  }
  for(var p=particles.length-1;p>=0;p--){
    var q=particles[p]; q.t+=dt;
    if(q.t>q.life){ particles.splice(p,1); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt; q.vy-=30*dt;
  }
  if(shake>0) shake-=dt*2;
  if(msgT>0) msgT-=dt;
  if(spectMsgT>0) spectMsgT-=dt;
  if(spectate&&state==='play'){
    var anyAlive=false;
    for(var m2=0;m2<enemies.length;m2++) if(enemies[m2].alive&&!enemies[m2].done) anyAlive=true;
    if(!anyAlive) finishSpectate();
  }
  updEngine();
}
function updateCam(dt){
  var t=spectate?raceLeader():P;
  cam.timer-=dt;
  if(cam.phase==='chase'&&cam.timer<=0){ cam.phase='top'; cam.phaseT=0; }
  if(cam.phase==='top'){ cam.phaseT+=dt; if(cam.phaseT>4.5){ cam.phase='chase'; cam.timer=13+Math.random()*8; } }
  var fx=Math.sin(t.ang), fz=Math.cos(t.ang), tx,ty,tz,tp;
  if(cam.phase==='chase'){ tx=t.x-fx*17; ty=7.5+cam.kick*10; tz=t.z-fz*17; tp=0.16; }
  else { tx=t.x-fx*8; ty=250; tz=t.z-fz*55; tp=-1.32; }
  var k=1-Math.pow(0.05,dt);
  cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k; cam.z+=(tz-cam.z)*k;
  cam.pitch+=(tp-cam.pitch)*k;
  cam.yaw+=angDiff(t.ang,cam.yaw)*(1-Math.pow(0.02,dt));
  if(cam.kick>0) cam.kick=Math.max(0,cam.kick-dt*1.6);
}

var focal=800;
function proj(x,y,z){
  var dx=x-cam.x, dy=y-cam.y, dz=z-cam.z;
  var cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  var fwd=dz*cy+dx*sy;
  var r=dx*cy-dz*sy;
  var cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  var dep=fwd*cp+dy*sp;
  if(dep<2) return null;
  var up=dy*cp-fwd*sp;
  var f=focal*(1+cam.kick*0.4);
  return {x:W/2+f*r/dep, y:H/2-f*up/dep, d:dep};
}
function drawWorld(){
  var z0=cam.z-40, z1=cam.z+760;

  }
  ctx.strokeStyle='rgba(30,120,255,0.22)'; ctx.lineWidth=1; ctx.stroke();

    var a=proj(-AH-160,0,z), b=proj(AH+160,0,z);
    if(a&&b){ ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
  }

function drawStrip(zx,al){

function drawTrails(){
  for(var k=0;k<bikes.length;k++){
    var b=bikes[k];
    if(b.stunT>0) continue;
    var tr=b.trail;
    if(tr.length<2) continue;
    var col=b.col;
    var last=tr[tr.length-1];
    var pb=proj(last.x,0.3,last.z);
    var w=pb?clamp(focal*1.1/pb.d,1.2,8):3;
    var step=8;
    for(var i=0;i<tr.length-1;i+=step){
      var j=Math.min(i+step,tr.length-1);
      var al=1-(tG-tr[i].t)/TRAIL_LIFE;
      if(al<=0.03) continue;
      ctx.beginPath();
      var started=false;
      for(var q=i;q<=j;q++){
        var p=proj(tr[q].x,0.35,tr[q].z);
        if(!p){ started=false; continue; }
        if(!started){ ctx.moveTo(p.x,p.y); started=true; }
        else ctx.lineTo(p.x,p.y);
      }
      ctx.strokeStyle='rgba('+col+','+(al*0.18).toFixed(2)+')';
      ctx.lineWidth=w*3; ctx.stroke();
      ctx.strokeStyle='rgba('+col+','+(al*0.9).toFixed(2)+')';
      ctx.lineWidth=w; ctx.stroke();
    }
  }
}
function drawParticles(){

function drawTurbineCapsule(L,sd,zi,s,col){
  var q1=L(sd*1.15,0.5,zi+0.6), q2=L(sd*1.15,0.5,zi-0.6);
  if(!q1||!q2) return;
  ctx.strokeStyle='rgba(10,20,38,0.95)';
  ctx.lineWidth=Math.max(3,s*0.30);
  ctx.beginPath(); ctx.moveTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y); ctx.stroke();
  ctx.strokeStyle=col+'0.35)';
  ctx.lineWidth=Math.max(4,s*0.5); ctx.stroke();
  ctx.strokeStyle=col+'0.95)';
  ctx.lineWidth=Math.max(1.5,s*0.11); ctx.stroke();
  var mx=(q1.x+q2.x)/2, my=(q1.y+q2.y)/2;
  var tg2=ctx.createRadialGradient(mx,my,1,mx,my,s*0.9);
  tg2.addColorStop(0,col+'0.5)'); tg2.addColorStop(1,col+'0)');
  ctx.fillStyle=tg2; ctx.beginPath(); ctx.arc(mx,my,s*0.9,0,TAU); ctx.fill();
  for(var e2=0;e2<2;e2++){
    var pt=e2?q2:q1, rr=s*0.24;
    ctx.fillStyle='rgba(8,14,26,0.95)';
    ctx.beginPath(); ctx.arc(pt.x,pt.y,rr,0,TAU); ctx.fill();
    ctx.strokeStyle=col+'0.95)'; ctx.lineWidth=Math.max(1,s*0.07);
    ctx.beginPath(); ctx.arc(pt.x,pt.y,rr,0,TAU); ctx.stroke();
    ctx.fillStyle=col+'0.9)';
    ctx.beginPath(); ctx.arc(pt.x,pt.y,rr*0.4*(0.8+0.2*Math.sin(tG*10+sd+zi)),0,TAU); ctx.fill();
  }
}
function drawBikes(){
  for(var k=0;k<bikes.length;k++){
    var b=bikes[k];
    if(!b.alive||b.done) continue;
    var p=proj(b.x,0.8,b.z);
    if(!p||p.d>700) continue;
    var s=focal/p.d;
    var col='rgba('+b.col+',';
    var fx=Math.sin(b.ang), fz=Math.cos(b.ang);
    var rx=Math.cos(b.ang), rz=-Math.sin(b.ang);

    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=Math.max(0.8,s*0.03); ctx.stroke();
    var pn=L(0,0.9,3.0), pt4=L(0,0.7,-2.6);

      ctx.save(); ctx.translate(cx2,cy2); ctx.rotate(rot);

        ctx.beginPath(); ctx.ellipse(-rl*0.25,-rl*0.1,rl*0.3,rl*0.12,0.4,0,TAU);
        ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fill();
      } else if(b.sty.can==='slit'){

        ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=Math.max(0.8,s*0.03);
        ctx.beginPath(); ctx.moveTo(-rl*0.5,-rl*0.12); ctx.lineTo(rl*0.5,-rl*0.12); ctx.stroke();
      } else {
        for(var tw=-1;tw<=1;tw+=2){

          ctx.strokeStyle=col+'0.9)'; ctx.lineWidth=Math.max(1,s*0.06); ctx.stroke();
        }
      }
      ctx.restore();
    }
    if(b.sty.fin){
      var f1=L(0,0.7,-1.6), f2=L(0,1.7,-2.5), f3=L(0,0.7,-2.4);
      if(f1&&f2&&f3){
        ctx.beginPath(); ctx.moveTo(f1.x,f1.y); ctx.lineTo(f2.x,f2.y); ctx.lineTo(f3.x,f3.y); ctx.closePath();
        ctx.fillStyle='rgba(10,20,38,0.92)'; ctx.fill();
        ctx.strokeStyle=col+'0.85)'; ctx.lineWidth=Math.max(1,s*0.06); ctx.stroke();
      }
    }
    if(b.sty.wings){
      var w1=L(-1.1,0.5,1.7), w2=L(-0.3,0.5,2.0), w3=L(0.3,0.5,2.0), w4=L(1.1,0.5,1.7);
      if(w1&&w2&&w3&&w4){
        ctx.beginPath(); ctx.moveTo(w1.x,w1.y); ctx.lineTo(w2.x,w2.y); ctx.lineTo(w3.x,w3.y); ctx.lineTo(w4.x,w4.y); ctx.closePath();
        ctx.fillStyle='rgba(10,20,38,0.9)'; ctx.fill();
        ctx.strokeStyle=col+'0.8)'; ctx.lineWidth=Math.max(1,s*0.05); ctx.stroke();
      }
    }
    if(b.parts&&b.parts.spoiler){
      var s1=L(-1.2,0.9,-2.5), s2=L(-1.2,1.35,-2.15), s3=L(1.2,1.35,-2.15), s4=L(1.2,0.9,-2.5);
      if(s1&&s2&&s3&&s4){
        ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.lineTo(s3.x,s3.y); ctx.lineTo(s4.x,s4.y); ctx.closePath();
        ctx.fillStyle='rgba(14,26,46,0.95)'; ctx.fill();
        ctx.strokeStyle=col+'0.9)'; ctx.lineWidth=Math.max(1,s*0.07); ctx.stroke();
      }
    }
    if(b.parts&&b.parts.front){
      var t1=L(-0.75,0.55,2.35), t2=L(-0.75,0.8,2.05), t3=L(0.75,0.8,2.05), t4=L(0.75,0.55,2.35);
      if(t1&&t2&&t3&&t4){
        ctx.beginPath(); ctx.moveTo(t1.x,t1.y); ctx.lineTo(t2.x,t2.y); ctx.lineTo(t3.x,t3.y); ctx.lineTo(t4.x,t4.y); ctx.closePath();
        ctx.fillStyle='rgba(14,26,46,0.95)'; ctx.fill();
        ctx.strokeStyle=col+'0.9)'; ctx.lineWidth=Math.max(1,s*0.07); ctx.stroke();
      }
    }
    if(s>7){
      for(var rr2=0;rr2<3;rr2++){
        var rz3=0.7-rr2*0.85;
        var a2=L(1.0,0.62,rz3), c2=L(-1.0,0.62,rz3);
        if(a2&&c2){
          ctx.strokeStyle=col+'0.35)'; ctx.lineWidth=Math.max(1,s*0.05);
          ctx.beginPath(); ctx.moveTo(a2.x,a2.y); ctx.lineTo(c2.x,c2.y); ctx.stroke();
        }
      }
    }
    var en2=L(0,0.8,-2.45);
    if(en2){
      var pulse=0.8+0.2*Math.sin(tG*12);
      var eg=ctx.createRadialGradient(en2.x,en2.y,1,en2.x,en2.y,s*0.9*pulse);
      eg.addColorStop(0,'rgba(255,255,255,0.95)');
      eg.addColorStop(0.4,col+'0.8)');
      eg.addColorStop(1,col+'0)');
      ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(en2.x,en2.y,s*0.9*pulse,0,TAU); ctx.fill();
    }
    if(b.boost||b.freeT>0){
      var j1=L(0,0.8,-2.9), j2=L(0,0.8,-5.5-Math.random()*1.5);
      if(j1&&j2){
        ctx.strokeStyle=col+'0.75)'; ctx.lineWidth=Math.max(2,s*0.5);
        ctx.beginPath(); ctx.moveTo(j1.x,j1.y); ctx.lineTo(j2.x,j2.y); ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=Math.max(1,s*0.18);
        ctx.beginPath(); ctx.moveTo(j1.x,j1.y); ctx.lineTo(j2.x,j2.y); ctx.stroke();
      }
    }
    if(s>5){
      var hl=L(0,0.95,3.0);
      if(hl){
        ctx.fillStyle='rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(hl.x,hl.y,Math.max(1,s*0.1),0,TAU); ctx.fill();
      }
    }
    if(b.slowT>0){
      ctx.strokeStyle='rgba(255,80,80,0.9)'; ctx.lineWidth=Math.max(1,s*0.12);
      ctx.beginPath(); ctx.arc(p.x,p.y,s*1.6,0,TAU); ctx.stroke();
    }
  }
}

function iconTurbine(g,sd,zi,sc,colStr){
  var y1=-zi*sc-sc*0.6, y2=-zi*sc+sc*0.6, x=sd*1.15*sc;
  g.strokeStyle='rgba(10,20,38,0.95)'; g.lineWidth=sc*0.34;
  g.beginPath(); g.moveTo(x,y1); g.lineTo(x,y2); g.stroke();
  g.strokeStyle='rgba('+colStr+',0.35)'; g.lineWidth=sc*0.56; g.stroke();
  g.strokeStyle='rgba('+colStr+',0.95)'; g.lineWidth=sc*0.12; g.stroke();
  for(var e2=0;e2<2;e2++){
    var py=e2?y2:y1, rr=sc*0.22;
    g.fillStyle='rgba(8,14,26,0.95)';
    g.beginPath(); g.arc(x,py,rr,0,TAU); g.fill();
    g.strokeStyle='rgba('+colStr+',0.95)'; g.lineWidth=sc*0.08;
    g.beginPath(); g.arc(x,py,rr,0,TAU); g.stroke();
    g.fillStyle='rgba('+colStr+',0.9)';
    g.beginPath(); g.arc(x,py,rr*0.4,0,TAU); g.fill();
  }
}
function bikeIcon(canvas, styId, colStr, parts){
  var st=STYLES[styId];
  var g=canvas.getContext('2d');
  var cw=canvas.width, ch=canvas.height;
  g.clearRect(0,0,cw,ch);
  g.save();
  g.translate(cw/2, ch/2);
  var sc=Math.min(cw/10, ch/8.5);
  var rg=g.createRadialGradient(0,0,2,0,0,sc*4.4);
  rg.addColorStop(0,'rgba('+colStr+',0.35)'); rg.addColorStop(1,'rgba('+colStr+',0)');
  g.fillStyle=rg; g.beginPath(); g.arc(0,0,sc*4.4,0,TAU); g.fill();
  if(parts&&parts.side){ iconTurbine(g,-1,0.5,sc,colStr); iconTurbine(g,1,0.5,sc,colStr); iconTurbine(g,-1,-1.4,sc,colStr); iconTurbine(g,1,-1.4,sc,colStr); }
  else if(st.pods){ iconTurbine(g,-0.85,0.3,sc*0.8,colStr); iconTurbine(g,0.85,0.3,sc*0.8,colStr); iconTurbine(g,-0.85,-1.2,sc*0.8,colStr); iconTurbine(g,0.85,-1.2,sc*0.8,colStr); }
  var prof=st.prof;
  g.beginPath();
  g.moveTo(0,-prof[0][1]*sc);
  for(var i=1;i<prof.length;i++) g.lineTo(prof[i][0]*sc,-prof[i][1]*sc);
  for(var j=prof.length-2;j>=0;j--) g.lineTo(-prof[j][0]*sc,-prof[j][1]*sc);
  g.closePath();
  var hg=g.createLinearGradient(0,-3*sc,0,3*sc);
  hg.addColorStop(0,'#12233d'); hg.addColorStop(1,'#050a16');
  g.fillStyle=hg; g.fill();
  var nK=(parts&&parts.neon)?NEON_K:1;
  g.strokeStyle='rgba('+colStr+',0.25)'; g.lineWidth=sc*0.5*nK; g.stroke();
  g.strokeStyle='rgba('+colStr+',0.95)'; g.lineWidth=sc*0.16*nK; g.stroke();
  var cs=sc;
  if(st.can==='bubble'){
    g.beginPath(); g.ellipse(0,-0.35*sc,cs*0.42,cs*0.7,0,0,TAU);
    g.fillStyle='rgba(120,220,255,0.35)'; g.fill();
    g.strokeStyle='rgba('+colStr+',0.9)'; g.lineWidth=sc*0.1; g.stroke();
    g.beginPath(); g.ellipse(-cs*0.12,-cs*0.55,cs*0.16,cs*0.26,0,0,TAU);
    g.fillStyle='rgba(255,255,255,0.4)'; g.fill();
  } else if(st.can==='slit'){
    g.strokeStyle='rgba('+colStr+',0.95)'; g.lineWidth=sc*0.16;
    g.beginPath(); g.moveTo(-cs*0.3,-cs*0.85); g.lineTo(cs*0.3,-cs*0.85); g.stroke();
  } else {
    for(var tw=-1;tw<=1;tw+=2){
      g.beginPath(); g.ellipse(tw*cs*0.32,-cs*0.5,cs*0.24,cs*0.38,0,0,TAU);
      g.fillStyle='rgba(120,220,255,0.35)'; g.fill();
      g.strokeStyle='rgba('+colStr+',0.9)'; g.lineWidth=sc*0.1; g.stroke();
    }
  }
  if(st.fin){
    g.strokeStyle='rgba('+colStr+',0.85)'; g.lineWidth=sc*0.22;
    g.beginPath(); g.moveTo(0,-1.6*sc); g.lineTo(0,-2.5*sc); g.stroke();
  }
  if(st.wings||(parts&&parts.front)){
    g.beginPath();
    g.moveTo(-1.1*sc,-1.7*sc); g.lineTo(-0.3*sc,-2.0*sc);
    g.lineTo(0.3*sc,-2.0*sc); g.lineTo(1.1*sc,-1.7*sc);
    g.closePath();
    g.fillStyle='rgba(14,26,46,0.9)'; g.fill();
    g.strokeStyle='rgba('+colStr+',0.8)'; g.lineWidth=sc*0.12; g.stroke();
  }
  if(parts&&parts.spoiler){
    g.beginPath();
    g.moveTo(-1.2*sc,-2.5*sc); g.lineTo(-1.2*sc,-2.15*sc);
    g.lineTo(1.2*sc,-2.15*sc); g.lineTo(1.2*sc,-2.5*sc);
    g.closePath();
    g.fillStyle='rgba(14,26,46,0.95)'; g.fill();
    g.strokeStyle='rgba('+colStr+',0.9)'; g.lineWidth=sc*0.14; g.stroke();
  }
  g.fillStyle='rgba(8,14,26,0.95)';
  g.beginPath(); g.arc(0,-1.55*sc,sc*0.42,0,TAU); g.fill();
  g.beginPath(); g.arc(0,1.85*sc,sc*0.5,0,TAU); g.fill();
  g.strokeStyle='rgba('+colStr+',0.8)'; g.lineWidth=sc*0.1;
  g.beginPath(); g.arc(0,-1.55*sc,sc*0.42,0,TAU); g.stroke();
  g.beginPath(); g.arc(0,1.85*sc,sc*0.5,0,TAU); g.stroke();
  g.restore();
}

function showPanel(html){ panel.innerHTML=html; overlay.style.display='flex'; }
function startGame(){ reset(); state='count'; countT=3.3; countPrev=-99; initAudio(); overlay.style.display='none'; }
function saveBest(){ if(score>best){ best=Math.round(score); SV.best=best; } saveGame(); }
// Соперники копят кристаллы в междуконьковое хранилище и покупают апгрейды
function rivalsEconomy(){
  var changed=false;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i], rn=e.rider?e.rider.n:null;
    if(!rn) continue;
    var rv=SV.rivals[rn]; if(!rv) continue;
    rv.cr+=e.crystals+120; changed=true;
    if(Math.random()<0.85){
      var opts=[];
      var keys=['spd','tank','boost'];
      for(var k2=0;k2<keys.length;k2++){
        var kk=keys[k2], lv=(rv[kk]||0)+1;
        if(lv<RIV_PR[kk].length) opts.push({k:kk,lv:lv,pr:RIV_PR[kk][lv]});
      }
      if(opts.length){
        var pick=opts[(Math.random()*opts.length)|0];
        if(rv.cr>=pick.pr){ rv.cr-=pick.pr; rv[pick.k]=pick.lv; }
      }
    }
  }
  if(changed) saveGame();
}
// Победа открывает аппарат соперника, который дальше всех проехал к финишу
function unlockSilver(){
  var bestE=null, bz=-1e9;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.rider||SV.unlocked.indexOf(e.rider.n)>=0) continue;
    if(e.z>bz){ bz=e.z; bestE=e.rider; }
  }
  if(bestE){ SV.unlocked.push(bestE.n); newUnlock=bestE; saveGame(); }
}
function awardPrizes(place){
  SV.bank+=crysN+(place===1?800:0);
  saveGame();
}
function standingsHtml(){
  var s='';
  for(var i=0;i<finishOrder.length;i++){
    var b=finishOrder[i];
    s+='<p style="margin:4px 0;font-size:14px">'+(i+1)+'. <b style="color:rgb('+b.col+')">'+b.rname+'</b> — кристаллов: '+b.crystals+'</p>';
  }
  return s;
}
function winGame(){
  state='over'; saveBest();
  rivalsEconomy();
  if(P.place===1) unlockSilver();
  awardPrizes(P.place);
  var pl=P.place;
  var tt=pl===1?'ПОБЕДА!':(pl===2?'СЕРЕБРО!':(pl===3?'БРОНЗА!':'ЗАЕЗД ЗАВЕРШЁН'));
  var html='<h1>ФИНИШ!</h1><p class="go">'+pl+' МЕСТО — '+tt+'</p>'+standingsHtml();
  if(newUnlock){
    html+='<p class="go">ОТКРЫТ К ПОКУПКЕ: '+newUnlock.n+'!</p>';
    html+='<p style="font-size:12px">Ждёт в разделе «МОТОЦИКЛЫ» за '+newUnlock.price+' ◈</p>';
    newUnlock=null;
  }
  html+='<p>В банк: <b style="color:#c89cff">'+crysN+'</b> ◈ · Очки: <b style="color:#35f0ff">'+Math.round(score)+'</b></p><div class="btnrow"><button id="goBtn">ЕЩЁ РАЗ</button><button class="alt" id="menuBtn">В ГЛАВНОЕ МЕНЮ</button></div>';
  showPanel(html);
  document.getElementById('goBtn').onclick=startGame;
  document.getElementById('menuBtn').onclick=mainMenu;
}
function gameOver(){
  state='over'; saveBest(); rivalsEconomy(); awardPrizes(0);
  showPanel('<h1>ВЫБЫЛ ИЗ ГОНКИ</h1>'+standingsHtml()+'<p>В банк: <b style="color:#c89cff">'+crysN+'</b> ◈ · Очки: '+Math.round(score)+'</p><div class="btnrow"><button id="goBtn">ЕЩЁ РАЗ</button><button class="alt" id="menuBtn">В ГЛАВНОЕ МЕНЮ</button></div>');

  var selName=SV.sel==='you'?'АВАНГАРД':SV.sel;
  var html='<h1>ГАРАЖ</h1><p>Банк: <b style="color:#c89cff">'+SV.bank+'</b> ◈ · Тюнинг: <b style="color:#7dffc0">'+selName+'</b></p>'+
    '<p style="font-size:11px">Уровни у каждого аппарата свои — покупай байк и качай его отдельно. Следующий стоковый чуть слабее полностью прокачанного текущего.</p>';
  html+='<div class="btnrow"><button class="'+(garTab==='up'?'':'dim')+'" id="tU">УЛУЧШЕНИЯ</button>'+
    '<button class="'+(garTab==='r'?'':'dim')+'" id="tR">СТАН СОПЕРНИКОВ</button></div>';
  if(garTab==='up'){
    var u=curTune();
    var mySty=STYLES[(SV.sel!=='you')?getRider(SV.sel).sty:'you'];
    var list=mySty.uk;
    for(var i=0;i<list.length;i++){
      var up=null;
      for(var q3=0;q3<UPGRADES.length;q3++) if(UPGRADES[q3].k===list[i]){ up=UPGRADES[q3]; break; }
      if(!up) continue;
      var lv=u[up.k]||0;
      var maxL=up.pr.length-1;
      if(lv<maxL){
        var price=up.pr[lv+1];
        html+='<div class="grow"><div class="t"><b>'+up.nm+' ('+lv+') → ('+(lv+1)+')</b><br><span>'+up.d+': '+up.fx[lv+1]+'</span></div>'+
          '<button data-upg="'+up.k+'"'+(SV.bank<price?' disabled':'')+'>'+price+' ◈</button></div>';
      } else {
        html+='<div class="grow"><div class="t"><b>✔ '+up.nm+' — максимум</b><br><span>'+up.fx[lv]+'</span></div><button disabled>ЕСТЬ</button></div>';
      }
    }
    html+='<p style="font-size:11px">У этого аппарата '+list.length+' веток прокачки. Вернуться к другому — выбери его в мотосалоне, прогресс каждого сохраняется отдельно.</p>';
  } else {
    for(var q2=0;q2<RIDERS.length;q2++){
      var r3=RIDERS[q2], rv2=SV.rivals[r3.n]||{cr:0,spd:0,tank:0,boost:0};
      html+='<div class="grow"><div class="t"><b style="color:rgb('+r3.col+')">'+r3.n+'</b><br><span>Кошелёк: '+rv2.cr+' ◈ · Скор ур.'+(rv2.spd||0)+'/3 · Бак ур.'+(rv2.tank||0)+'/3 · Тяга ур.'+(rv2.boost||0)+'/3</span></div></div>';
    }
    html+='<p style="font-size:11px">Они стартуют на уровне стока твоего аппарата и растут от заезда к заезду. Догоняй — или они догонят.</p>';
  }
  html+='<div class="btnrow"><button class="dim" id="grBack">НАЗАД</button></div>';
  showPanel(html);
  document.getElementById('tU').onclick=function(){ garTab='up'; garagePanel(); };
  document.getElementById('tR').onclick=function(){ garTab='r'; garagePanel(); };
  document.getElementById('grBack').onclick=mainMenu;
  var us=panel.querySelectorAll('button[data-upg]');
  for(var g2=0;g2<us.length;g2++){
    us[g2].onclick=function(){
      var k3=this.getAttribute('data-upg');
      for(var ui=0;ui<UPGRADES.length;ui++){
        if(UPGRADES[ui].k===k3){
          var ut=curTune();
          var lv2=ut[k3]||0;
          if(lv2<UPGRADES[ui].pr.length-1){
            var price2=UPGRADES[ui].pr[lv2+1];
            if(SV.bank>=price2){ SV.bank-=price2; ut[k3]=lv2+1; saveGame(); garagePanel(); }
          }
          break;
        }
      }
    };
  }
}
// ================= УПРАВЛЕНИЕ =================
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA') steerKey=-1;
  else if(e.code==='ArrowRight'||e.code==='KeyD') steerKey=1;
  else if(e.code==='Space'){ boostKey=true; e.preventDefault(); }
  else if(e.code==='Enter'&&state!=='play'&&state!=='count') startGame();
});
window.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='ArrowRight'||e.code==='KeyD') steerKey=0;
  else if(e.code==='Space') boostKey=false;
});
cv.addEventListener('touchstart',function(e){ touchOn=true; touchX0=e.touches[0].clientX; },{passive:true});
cv.addEventListener('touchmove',function(e){ if(!touchOn) return; touchSteer=clamp((e.touches[0].clientX-touchX0)/(innerWidth*0.16),-1,1); },{passive:true});
cv.addEventListener('touchend',function(){ touchOn=false; touchSteer=0; },{passive:true});
bb.addEventListener('touchstart',function(e){ e.preventDefault(); boostBtnOn=true; },{passive:false});
bb.addEventListener('touchend',function(){ boostBtnOn=false; },{passive:true});
bb.addEventListener('mousedown',function(){ boostBtnOn=true; });
bb.addEventListener('mouseup',function(){ boostBtnOn=false; });
// ================= ЗАПУСК =================
function setFocal(){ focal=Math.min(H*0.95,W*1.35); }
setFocal();
window.addEventListener('resize',setFocal);
mainMenu();
requestAnimationFrame(function loop(ts){
  requestAnimationFrame(loop);
  if(!ts) return;
  if(!loop.last) loop.last=ts;
  var dt=Math.min(0.05,(ts-loop.last)/1000); loop.last=ts;
  tG+=dt;
  if(state==='count'){
    countT-=dt;
    var n=countT>0?Math.ceil(countT):0;
    if(n!==countPrev){
      countPrev=n;
      if(AC){ if(n>0) tone(392,AC.currentTime,0.15,'square',0.15); else tone(784,AC.currentTime,0.45,'square',0.2); }
    }
    if(countT<=-0.7){ state='play'; graceT=1.5; }
  }
  if(state==='play'||state==='over') update(dt);
  updateCam(dt);
  render();
});
})();
</script>
</body>
</html>
